# App Platform spec for asgard. The deploy workflow applies it on every push to
# main, creating the app on the first run. `${NAME}` values are filled from the
# workflow's environment; `${component.VAR}` values are bindables App Platform
# resolves itself.
name: asgard
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS record in the ivoryimage.dev domain.
domains:
  - domain: auth.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev

databases:
  - name: bifrost-db
    engine: PG
    version: '16'
    production: false

ingress:
  rules:
    - component:
        name: bifrost
      match:
        path:
          prefix: /

services:
  - name: bifrost
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: bifrost
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${bifrost-db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${SECRET_KEY}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${SESSION_SECRET}
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: https://admin.ivoryimage.dev,https://places.ivoryimage.dev
