# App Platform spec for asgard. The deploy workflow applies it on every push to
# main, creating the app on the first run. `${NAME}` values are filled from the
# workflow's environment; `${component.VAR}` values are bindables App Platform
# resolves itself.
name: asgard
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS record in the ivoryimage.dev domain.
domains:
  - domain: auth.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev

# Binds the existing managed cluster, so the data outlives the app. Binding
# also adds the app to the cluster's trusted sources.
databases:
  - name: asgard-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: defaultdb

ingress:
  rules:
    - component:
        name: bifrost
      match:
        path:
          prefix: /

services:
  - name: bifrost
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: bifrost
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${asgard-db.DATABASE_URL}
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: https://admin.ivoryimage.dev,https://places.ivoryimage.dev
      # Passkeys belong to the parent domain, so one works on every app under it.
      - key: PASSKEY_DOMAIN
        scope: RUN_TIME
        value: ivoryimage.dev
      # App Platform overwrites this header with the client address on every
      # request, so clients can't spoof it.
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
      # Shared with Midgard, whose server forwards the browser address. The
      # PROXY_SECRET repo secret must be set before this deploys.
      - key: PROXY_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${PROXY_SECRET}
      # Encrypts authenticator-app secrets. Unset turns authenticator apps off;
      # changing it breaks every authenticator app already added.
      - key: MFA_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MFA_ENCRYPTION_KEY}
