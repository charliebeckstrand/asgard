# App Platform spec for asgard. The deploy workflow applies it on every push to
# main, creating the app on the first run. `${NAME}` values are filled from the
# workflow's environment; `${component.VAR}` values are bindables App Platform
# resolves itself.
name: asgard
region: nyc

# Alerts go to the destinations set in the App Platform dashboard. Downtime is
# caught by the uptime check on auth.ivoryimage.dev, which lives outside the app.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# `zone` lets App Platform manage the DNS record in the ivoryimage.dev domain.
domains:
  - domain: auth.ivoryimage.dev
    type: PRIMARY
    zone: ivoryimage.dev

# Binds the existing managed cluster, so the data outlives the app. Binding
# also adds the app to the cluster's trusted sources.
#
# Each database is bound twice, once for each user. The migrate jobs connect as
# the admin user, which owns the tables and can change them. Each service
# connects as its own user, which can only read and write rows, so a flaw in a
# service can't change the schema. Bifrost's tables live in `defaultdb`,
# Vidar's in `vidar` and Mimir's in `places`, so no service can read another's.
# `places` and its user were made for Midgard's places app, which used them
# before Mimir.
databases:
  - name: asgard-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: defaultdb
  - name: bifrost-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: defaultdb
    db_user: bifrost
  - name: vidar-admin-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: vidar
  - name: vidar-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: vidar
    db_user: vidar
  - name: mimir-admin-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: places
  - name: mimir-db
    engine: PG
    version: '18'
    production: true
    cluster_name: app-60313cef-8ae5-4240-9538-6a5b4fc46c0f
    db_name: places
    db_user: places

ingress:
  rules:
    - component:
        name: bifrost
      match:
        path:
          prefix: /

services:
  - name: bifrost
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    # More than a couple of restarts means the service is crashing. Memory is the
    # tight one on a 0.5 GB instance.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # Sends the service's logs to Better Stack, which keeps them longer than App
    # Platform does.
    log_destinations:
      - name: better-stack
        logtail:
          token: ${LOGTAIL_TOKEN}
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: bifrost
      # Reported as the version by /api/health.
      - key: COMMIT_HASH
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${bifrost-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${bifrost-db.CA_CERT}
      - key: APP_ORIGINS
        scope: RUN_TIME
        value: https://admin.ivoryimage.dev,https://places.ivoryimage.dev,https://picks.ivoryimage.dev
      # Passkeys belong to the parent domain, so one works on every app under it.
      - key: PASSKEY_DOMAIN
        scope: RUN_TIME
        value: ivoryimage.dev
      # Shared with Midgard, whose server forwards the browser address. Bifrost
      # won't start without it.
      - key: CLIENT_IP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${CLIENT_IP_SECRET}
      # Encrypts authenticator-app secrets. Unset turns authenticator apps off.
      # Bifrost won't start with a key that can't read the stored secrets, so a
      # lost or changed value fails the deploy. Keep a copy outside GitHub and DO.
      - key: MFA_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MFA_ENCRYPTION_KEY}
      # OAuth clients for signing in with GitHub and Google. A provider without
      # both values is off.
      - key: OAUTH_GITHUB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: ${OAUTH_GITHUB_CLIENT_ID}
      - key: OAUTH_GITHUB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${OAUTH_GITHUB_CLIENT_SECRET}
      - key: OAUTH_GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: ${OAUTH_GOOGLE_CLIENT_ID}
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${OAUTH_GOOGLE_CLIENT_SECRET}
      # Sends verification and password reset emails through Resend. Unset logs
      # each email instead of sending it.
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${RESEND_API_KEY}
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: Ivory Image <no-reply@ivoryimage.dev>
      # Cloudflare Turnstile on sign-up. Without both values, sign-up has no check.
      - key: TURNSTILE_SITE_KEY
        scope: RUN_TIME
        value: ${TURNSTILE_SITE_KEY}
      - key: TURNSTILE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${TURNSTILE_SECRET_KEY}
      # Vidar bans addresses that keep failing to sign in. It's reached over the
      # app's private network, and the key must match Vidar's.
      - key: VIDAR_URL
        scope: RUN_TIME
        value: ${vidar.PRIVATE_URL}
      - key: VIDAR_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${VIDAR_API_KEY}
      # Mimir keeps the apps' data. Bifrost forwards /api/places, /api/visits,
      # /api/trips, /api/photos and /api/predictions to it over the app's private
      # network, and the key must match Mimir's.
      - key: MIMIR_URL
        scope: RUN_TIME
        value: ${mimir.PRIVATE_URL}
      - key: MIMIR_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MIMIR_API_KEY}

  # Private: no route or domain, so only the app's own services reach it. One
  # instance, because its live event stream is kept in memory. Admins read it
  # through bifrost's /api/security routes.
  - name: vidar
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    internal_ports:
      - 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /vidar/health
      port: 8000
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    # Each ban logs "rule triggered", which Better Stack can alert on.
    log_destinations:
      - name: better-stack
        logtail:
          token: ${LOGTAIL_TOKEN}
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: vidar
      # Reported as the version by /vidar/health.
      - key: COMMIT_HASH
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${vidar-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${vidar-db.CA_CERT}
      - key: VIDAR_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${VIDAR_API_KEY}

  # Private, like Vidar. Apps reach it through bifrost, which checks the session.
  - name: mimir
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    internal_ports:
      - 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      port: 8000
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    log_destinations:
      - name: better-stack
        logtail:
          token: ${LOGTAIL_TOKEN}
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: mimir
      # Reported as the version by /api/health.
      - key: COMMIT_HASH
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${mimir-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${mimir-db.CA_CERT}
      - key: MIMIR_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MIMIR_API_KEY}
      # The Spaces bucket that keeps photos, and its key.
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${SPACES_KEY}
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${SPACES_SECRET}
      - key: SPACES_REGION
        scope: RUN_TIME
        value: ${SPACES_REGION}
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: ${SPACES_BUCKET}
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
        value: ${SPACES_ENDPOINT}

# Apply each service's pending migrations before each deploy. If one fails, the
# deploy stops and the running version keeps serving.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    # Plain node, not pnpm: pnpm checks the install before running a command and
    # tries to reinstall the image's production-only dependencies, which fails.
    run_command: node packages/saga/bin/saga.js migrate --dir services/bifrost/migrations
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: bifrost
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${asgard-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${asgard-db.CA_CERT}
  - name: migrate-vidar
    kind: PRE_DEPLOY
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: node packages/saga/bin/saga.js migrate --dir services/vidar/migrations
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: vidar
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${vidar-admin-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${vidar-admin-db.CA_CERT}
  - name: migrate-mimir
    kind: PRE_DEPLOY
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: node packages/saga/bin/saga.js migrate --dir services/mimir/migrations
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: mimir
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${mimir-admin-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${mimir-admin-db.CA_CERT}

  # Copies the photos visits kept as web addresses into the Spaces bucket, once
  # the code that reads keys is live. Later runs find nothing left to copy.
  # Remove it once its logs show nothing copied or kept.
  - name: migrate-mimir-photos
    kind: POST_DEPLOY
    github:
      repo: charliebeckstrand/asgard
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: node services/mimir/dist/cli.js migrate-photos
    log_destinations:
      - name: better-stack
        logtail:
          token: ${LOGTAIL_TOKEN}
    envs:
      - key: SERVICE
        scope: BUILD_TIME
        value: mimir
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${mimir-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${mimir-db.CA_CERT}
      - key: MIMIR_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${MIMIR_API_KEY}
      # The Spaces bucket that keeps photos, and its key.
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${SPACES_KEY}
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${SPACES_SECRET}
      - key: SPACES_REGION
        scope: RUN_TIME
        value: ${SPACES_REGION}
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: ${SPACES_BUCKET}
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
        value: ${SPACES_ENDPOINT}
