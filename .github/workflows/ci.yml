name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_call:

jobs:
    ci:
        name: Lint, typecheck, test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            # Turbo hashes every task against its inputs and dependencies, so
            # unchanged packages replay from this cache instead of rerunning.
            - uses: actions/cache@v4
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile

            - run: pnpm turbo run lint typecheck test build

            # Keep the saved cache from growing without bound.
            - run: find .turbo/cache -type f -mtime +7 -delete
