name: CI

on:
    pull_request:
        branches: [main]
    # Pushes to main run CI through the deploy workflow.
    workflow_call:

jobs:
    ci:
        name: Lint, typecheck, test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            # Turbo hashes every task against its inputs and dependencies, so
            # unchanged packages replay from this cache instead of rerunning.
            - uses: actions/cache@v4
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - run: pnpm install --frozen-lockfile

            - run: pnpm turbo run lint typecheck test build

            # Fails on unused files, exports and dependencies.
            - run: pnpm knip

            # Keep the saved cache from growing without bound.
            - run: find .turbo/cache -type f -mtime +7 -delete

    # App Platform builds this same Dockerfile at deploy, so a broken image
    # fails here instead of after merge. Only on pull requests: on main the
    # deploy builds the image itself right after.
    docker:
        name: Build ${{ matrix.service }} image
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [bifrost, vidar]
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v3

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  build-args: SERVICE=${{ matrix.service }}
                  load: true
                  tags: asgard-${{ matrix.service }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}

            # The pre-deploy job runs migrations with this command, so check it
            # starts. With no database set it should stop at that check.
            - name: Check the migrate command runs
              run: |
                  output=$(docker run --rm asgard-${{ matrix.service }} node packages/saga/bin/saga.js migrate 2>&1 || true)
                  echo "$output"
                  grep -q 'DATABASE_URL is not set' <<< "$output"
