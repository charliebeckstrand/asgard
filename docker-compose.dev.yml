services:
  postgres:
    image: postgres:18-alpine
    container_name: asgard-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall
      POSTGRES_DB: bifrost
    volumes:
      # Postgres 18 images keep data under a versioned directory in this mount. A
      # fresh volume, since a 16 data directory can't be opened by 18.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heimdall']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres18-data:
