services:
  postgres:
    image: postgres:16-alpine
    container_name: asgard-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall
      POSTGRES_DB: bifrost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heimdall']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
